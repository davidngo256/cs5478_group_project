[project]
name = "cs5478-group-project"
version = "0.1.0"
description = "Does vision-estimated friction improve analytical grasp selection? CS5478 group project."
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    # embree ray casting for trimesh; there is no aarch64 Linux wheel, where trimesh falls back to its
    # own r-tree-accelerated ray-triangle intersector (that is what rtree is for)
    "embreex>=4.4.0; platform_machine == 'x86_64'",
    "huggingface-hub>=1.32.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "open-clip-torch>=3.3.0",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pybullet>=3.2.7",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
    "rtree>=1.4.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "trimesh>=5.1.0",
]

# torch/torchvision wheels by platform:
#   aarch64 Linux: CUDA 13.0 wheels. The NVIDIA GB10 (DGX Spark, Blackwell sm_121) needs Blackwell kernels,
#                  which the cu126 wheels lack, and the cu128 index has no aarch64 wheels; cu130 needs
#                  NVIDIA driver >= 580.
#   x86_64 Linux:  CUDA 12.6 wheels (driver >= 525 via CUDA 12 minor-version compatibility; the L4 box).
#   elsewhere:     CPU wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine != 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
